name: Desktop

on:
  push:
    branches: [main]
    paths:
      - desktop/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis portable
          - os: ubuntu-latest
            args: --linux AppImage
          - os: macos-latest
            args: --mac zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        working-directory: desktop
        run: |
          npm install
          npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: nox-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.zip
            desktop/dist/*.dmg
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop
          name: Nox desktop
          body: |
            Install once. Nox itself always loads the live catalog, so site updates land automatically — you do not reinstall this window when the catalog changes.

            Windows: Nox Setup.exe (installer) or Nox-portable.exe
            macOS: zip — open it, then right-click Nox and choose Open the first time
            Linux: AppImage — mark it executable and run
          files: artifacts/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
