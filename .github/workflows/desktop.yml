name: Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches: [main]
    paths:
      - desktop/**
      - src/**
      - scripts/build-desktop-catalog.mjs
      - scripts/fetch-libvlc.mjs
      - .github/workflows/desktop.yml

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis portable
          - os: ubuntu-latest
            args: --linux AppImage
          - os: macos-latest
            args: --mac zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app
        run: npm ci
      - name: Build catalog
        run: node scripts/build-desktop-catalog.mjs
      - name: Install desktop
        working-directory: desktop
        run: npm ci
      - name: Bundle libVLC
        if: runner.os == 'Windows'
        run: node scripts/fetch-libvlc.mjs
      - name: Package
        working-directory: desktop
        run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: nox-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.zip
            desktop/dist/*.dmg
            desktop/dist/*.yml
            desktop/dist/*.blockmap
          if-no-files-found: warn

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Nox ${{ needs.version.outputs.version }}
          body: |
            Independent Nox app — the catalog runs on this computer. No website required.

            1.3.4 starts playback in the Windows app without a Play with sound click. If VLC cannot open a stream it falls through to the other player instead of spinning forever.

            Windows plays Atmos / DTS / AC3 / TrueHD through built-in VLC. Nox chrome stays on top.

            After this install, new versions download themselves. You’ll get a restart prompt when one is ready.

            Windows: Nox-Setup-${{ needs.version.outputs.version }}.exe (use this for auto-update)
            Windows portable: Nox-portable-${{ needs.version.outputs.version }}.exe
            macOS: zip — open it, then right-click Nox and choose Open the first time
            Linux: AppImage
          files: artifacts/*
          fail_on_unmatched_files: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
