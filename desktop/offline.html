<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nox</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
        color: #f5f5f5;
        font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-family: "Bebas Neue", Outfit, sans-serif;
        font-size: 4rem;
        letter-spacing: 0.08em;
        color: #e50914;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 auto 1.5rem;
        max-width: 28rem;
        color: #b3b3b3;
        line-height: 1.5;
      }
      button {
        cursor: pointer;
        height: 2.75rem;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 4px;
        background: #f5f5f5;
        color: #000;
        font: 600 0.95rem Outfit, ui-sans-serif, system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>NOX</h1>
        <p>Nox could not open its built-in catalog. Restart the app. If this keeps happening, download a fresh installer.</p>
        <button type="button" id="retry">Try again</button>
      </div>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", () => {
        location.reload();
      });
    </script>
  </body>
</html>
